<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Book Quote Shorts</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Navbar -->
<nav class="navbar">
  <div class="nav-left">
    <div class="logo">📚 <strong>Quote Shorts</strong></div>
  </div>

  <!-- Desktop Links -->
  <ul class="nav-links">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="https://github.com/AdamEssara" target="_blank" rel="noopener">GitHub</a></li>
  </ul>

  <!-- Theme Toggle + Mobile Menu -->
  <div class="nav-right">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button>
    <button id="menuToggle" class="menu-toggle" aria-label="Open menu">☰</button>
  </div>
</nav>

<!-- Mobile menu -->
<div class="mobile-menu" id="mobileMenu">
  <a href="#">Home</a>
  <a href="#">About</a>
  <a href="https://github.com/your-username/book-quote-shorts" target="_blank" rel="noopener">GitHub</a>
</div>

  <!-- Main app wrapper (centered container) -->
  <main class="container">
    <header class="hero">
  <h1>Book Quote Shorts</h1>
  <p class="subtitle">Discover wisdom in short, snappy quotes from timeless books 📖</p>
</header>


    <section id="player" class="player">
      <button id="prev" class="nav">‹</button>

      <div class="card" id="card" aria-live="polite">
        <p id="quoteText" class="quote">Loading…</p>
        <p id="meta" class="meta"><span id="author"></span> — <em id="title"></em></p>

        <div class="controls">
          <button id="likeBtn" class="like">❤ <span id="likeCount">0</span></button>
          <button id="shareBtn" class="share">Share</button>
        </div>
      </div>

      <button id="next" class="nav">›</button>
    </section>

    <section class="player-controls">
      <button id="playPause">Pause</button>
  <label>
    Auto-play interval:
    <span class="select-wrapper">
      <select id="interval">
        <option value="3000">3s</option>
        <option value="5000" selected>5s</option>
        <option value="8000">8s</option>
      </select>
    </span>
  </label>
    </section>

    <footer>
      
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
